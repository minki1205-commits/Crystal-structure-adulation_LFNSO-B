[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lfnso-search"
version = "0.1.0"
description = "Provenance-aware crystallographic screening foundations"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pymatgen>=2025", "ncempy>=1.16,<2", "openpyxl>=3.1,<4"]

[project.scripts]
lfnso = "lfnso.pipeline:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
